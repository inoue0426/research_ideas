name: Research Idea Maps

on:
  workflow_dispatch:
  schedule:
    - cron: "30 15 * * 0"

permissions:
  contents: write

concurrency:
  group: research-elo
  cancel-in-progress: false

jobs:
  render-maps:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare map inference prompt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/research_idea_maps.py prepare \
            --prompt-file /tmp/research-idea-maps-prompt.txt

      - name: Infer themes and research relations with local Ollama
        env:
          OLLAMA_MODEL: qwen3:30b
        run: |
          python3 scripts/ollama_judge.py \
            --prompt-file /tmp/research-idea-maps-prompt.txt \
            --output-file /tmp/research-idea-maps-result.txt

      - name: Render SVG maps and README section
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/research_idea_maps.py render \
            --result-file /tmp/research-idea-maps-result.txt \
            --model-file .research-elo/idea-map.json

      - name: Re-render program graph hierarchically
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/render_research_program_hierarchy.py

      - name: Keep README maps compact
        run: python3 scripts/render_research_map_readme.py

      - name: Commit generated maps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/idea-landscape.svg assets/research-program.svg .research-elo/idea-map.json
          if git diff --cached --quiet; then
            echo "No map changes."
            exit 0
          fi
          git commit -m "Update research idea maps"
          git push
