name: Research Elo

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to rate (leave blank for automatic selection)"
        required: false
        type: string
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: research-elo
  cancel-in-progress: false

jobs:
  rate:
    if: ${{ github.event_name != 'issues' || github.event.issue.user.login == github.repository_owner }}
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve issue number
        id: issue
        env:
          MANUAL_ISSUE: ${{ inputs.issue_number }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$MANUAL_ISSUE" ]; then
            number="$MANUAL_ISSUE"
          elif [ "${{ github.event_name }}" = "issues" ]; then
            number="$EVENT_ISSUE"
          else
            number="$(python3 scripts/select_research_elo_issue.py)"
          fi
          echo "Selected issue #$number"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Prepare pairwise judging prompt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/research_elo.py prepare \
            --issue "${{ steps.issue.outputs.number }}" \
            --prompt-file /tmp/research-elo-prompt.txt \
            --context-file /tmp/research-elo-context.json

      - name: Judge with local Ollama
        env:
          OLLAMA_MODEL: qwen3:30b
        run: |
          python3 scripts/ollama_judge_v3.py \
            --prompt-file /tmp/research-elo-prompt.txt \
            --output-file /tmp/research-elo-result.txt \
            --retries 3

      - name: Apply Elo updates and comment on issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/research_elo.py apply \
            --issue "${{ steps.issue.outputs.number }}" \
            --context-file /tmp/research-elo-context.json \
            --result-file /tmp/research-elo-result.txt

      - name: Render README ranking
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/render_research_elo.py

      - name: Commit rating state and README ranking
        run: |
          if git diff --quiet -- .research-elo/ratings.json README.md; then
            echo "No rating or README change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .research-elo/ratings.json README.md
          git commit -m "Update Research Elo ranking"
          git push
