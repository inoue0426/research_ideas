name: Research Elo

on:
  schedule:
    - cron: "17 */3 * * *"

  issues:
    types:
      - opened
      - reopened

  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to rate (leave blank for automatic selection)"
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: research-elo
  cancel-in-progress: false

jobs:
  rate:
    if: >
      github.event_name != 'issues' ||
      github.event.issue.user.login == github.repository_owner

    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rate issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OLLAMA_MODEL: qwen3.8:27b
          MANUAL_ISSUE: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail

          rate_issue () {
            issue="$1"

            echo ""
            echo "========================================="
            echo "Rating issue #$issue"
            echo "========================================="

            python3 scripts/research_elo_core_v2.py prepare \
              --issue "$issue" \
              --prompt-file /tmp/research-elo-prompt.txt \
              --context-file /tmp/research-elo-context.json

            python3 scripts/ollama_judge_v3.py \
              --prompt-file /tmp/research-elo-prompt.txt \
              --output-file /tmp/research-elo-result.txt \
              --retries 3

            python3 scripts/research_elo_core_v2.py apply \
              --issue "$issue" \
              --context-file /tmp/research-elo-context.json \
              --result-file /tmp/research-elo-result.txt
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ -n "${MANUAL_ISSUE:-}" ]; then
            rate_issue "$MANUAL_ISSUE"
          fi

          iteration=0
          max_iterations=100

          while true; do
            issue="$(
              python3 scripts/select_research_elo_issue.py \
                --unrated-only
            )"

            if [ -z "$issue" ]; then
              echo ""
              echo "All open owner-authored issues have at least one evaluation."
              break
            fi

            iteration=$((iteration + 1))

            if [ "$iteration" -gt "$max_iterations" ]; then
              echo "Reached safety limit of $max_iterations iterations."
              exit 1
            fi

            rate_issue "$issue"
          done

      - name: Render README ranking
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/render_research_elo.py

      - name: Commit rating state and README ranking
        run: |
          if git diff --quiet -- .research-elo/ratings.json README.md; then
            echo "No rating or README change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .research-elo/ratings.json README.md
          git commit -m "Update Research Elo ranking"
          git push
