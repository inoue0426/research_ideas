name: Weekly Research Elo Cross-Rank Matches

on:
  schedule:
    - cron: "0 15 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-elo
  cancel-in-progress: false

jobs:
  weekly-cross-rank:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare weekly cross-rank matches
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/weekly_research_elo.py prepare \
            --prompt-file /tmp/weekly-research-elo-prompt.txt \
            --context-file /tmp/weekly-research-elo-context.json

      - name: Judge weekly matches with local Ollama
        env:
          OLLAMA_MODEL: qwen3:30b
        run: |
          python3 scripts/ollama_judge.py \
            --prompt-file /tmp/weekly-research-elo-prompt.txt \
            --output-file /tmp/weekly-research-elo-result.txt

      - name: Apply weekly Elo updates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/weekly_research_elo.py apply \
            --context-file /tmp/weekly-research-elo-context.json \
            --result-file /tmp/weekly-research-elo-result.txt

      - name: Render README ranking
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/render_research_elo.py

      - name: Commit weekly rating updates
        run: |
          if git diff --quiet -- .research-elo/ratings.json README.md; then
            echo "No rating or README change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .research-elo/ratings.json README.md
          git commit -m "Run weekly Research Elo cross-rank matches"
          git push
