name: Bootstrap Research Elo

on:
  workflow_dispatch:
  push:
    paths:
      - ".research-elo/bootstrap-trigger.txt"

permissions:
  contents: write
  issues: write

concurrency:
  group: research-elo
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run one bootstrap pass across all open owner issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OLLAMA_MODEL: qwen3:30b
        run: |
          set -euo pipefail

          issue_numbers="$(python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import research_elo

          issues = research_elo.fetch_open_owner_issues()
          print(' '.join(str(issue['number']) for issue in sorted(issues, key=lambda x: x['number'])))
          PY
          )"

          echo "Bootstrap issues: $issue_numbers"

          for issue in $issue_numbers; do
            echo "=== Rating issue #$issue ==="
            python3 scripts/research_elo.py prepare \
              --issue "$issue" \
              --prompt-file /tmp/research-elo-prompt.txt \
              --context-file /tmp/research-elo-context.json

            python3 scripts/ollama_judge_v3.py \
              --prompt-file /tmp/research-elo-prompt.txt \
              --output-file /tmp/research-elo-result.txt \
              --retries 3

            python3 scripts/research_elo.py apply \
              --issue "$issue" \
              --context-file /tmp/research-elo-context.json \
              --result-file /tmp/research-elo-result.txt
          done

      - name: Render README ranking
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/render_research_elo.py

      - name: Commit bootstrap ratings
        run: |
          if git diff --quiet -- .research-elo/ratings.json README.md; then
            echo "No rating or README change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .research-elo/ratings.json README.md
          git commit -m "Bootstrap Research Elo with local Qwen3 judge"
          git push
