name: Deploy Research Maps Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "assets/**"
      - "README.md"
      - "scripts/render_pages_elo.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: research-maps-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: |
          rm -rf _site
          mkdir -p _site/assets
          cp -R docs/. _site/
          cp assets/idea-landscape.svg _site/assets/idea-landscape.svg
          cp assets/research-program.svg _site/assets/research-program.svg
          python scripts/render_pages_elo.py --page _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
