name: Quick Research Idea
description: Capture an observation or research idea quickly before it disappears.
title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Capture first, evaluate later. Keep this lightweight.

        A useful minimal record is: **Observation → Problem → Impact → Hypothesis → Risk → First test**.

  - type: textarea
    id: observation
    attributes:
      label: Observation / anomaly
      description: What did you notice before explaining it? Record the empirical pattern, limitation, tension, contradiction, or surprising result separately from your interpretation.
      placeholder: I noticed that...
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Core idea / question
      description: State the possible research direction or question in 1–3 sentences.
      placeholder: The question or idea is...
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What important problem or unresolved limitation does this address?
      placeholder: The current problem is...
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Why could this matter?
      description: If resolved, what becomes possible, what decision changes, or what do we learn?
      placeholder: If successful, this could...
    validations:
      required: true

  - type: textarea
    id: insight
    attributes:
      label: Key insight / hypothesis
      description: What is the non-obvious explanation, mechanism, or connection?
      placeholder: The key hypothesis is...

  - type: textarea
    id: prediction
    attributes:
      label: Discriminating prediction
      description: If the hypothesis is correct, what should you observe? What would you expect instead if it is wrong?
      placeholder: |
        If correct, I expect...
        If wrong / an alternative explanation is true, I expect...

  - type: textarea
    id: why_unsolved
    attributes:
      label: Why might this still be unsolved?
      description: What has prevented this from being resolved already? Data, measurement, computation, incentives, framing, or perhaps it is already mostly solved.
      placeholder: This may remain unsolved because...

  - type: textarea
    id: risk
    attributes:
      label: Biggest uncertainty
      description: What is the most important assumption that might be wrong?
      placeholder: This depends on the assumption that...

  - type: textarea
    id: first_test
    attributes:
      label: Fastest useful test
      description: What is the cheapest analysis, experiment, prototype, or literature check that could materially change your mind?
      placeholder: The first thing to test is...

  - type: textarea
    id: source
    attributes:
      label: Trigger / source
      description: Paper, observation, dataset, conversation, limitation, link, or other source that triggered the idea.
      placeholder: Links, citations, notes...

  - type: dropdown
    id: next_step
    attributes:
      label: Current disposition
      options:
        - Just capture it
        - Worth a literature check
        - Worth a quick experiment / analysis
        - Worth deep evaluation
        - Potentially high priority
    validations:
      required: true
