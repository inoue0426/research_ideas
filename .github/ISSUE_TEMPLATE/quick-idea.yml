name: Quick Research Idea
description: Capture a research idea quickly before it disappears.
title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Capture first, evaluate later. Keep this lightweight.

        Write briefly under the four headings below. Japanese, English, or a mix is fine.

  - type: textarea
    id: quick_idea
    attributes:
      label: Quick research idea
      description: Capture the observation, core question, why it might matter, and the biggest uncertainty or next check in one place.
      value: |
        **Observation / trigger**

        

        **Core idea / question**

        

        **Why it might matter**

        

        **Biggest uncertainty / next check**

        
    validations:
      required: true
