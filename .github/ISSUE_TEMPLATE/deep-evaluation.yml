name: Research Idea — Deep Evaluation
description: Evaluate a research direction before committing substantial time.
title: "[Research Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Use this for ideas that may justify real research investment.

        The objective is not to make every section look strong. It is to expose **importance, falsifiability, assumptions, risk, competition, and decision points** clearly enough to make a good choice.

  - type: textarea
    id: observation
    attributes:
      label: Observation / motivating tension
      description: What was observed before proposing an explanation or method? Separate the empirical fact, anomaly, limitation, or contradiction from your interpretation.
      placeholder: |
        Observation:
        Why it is surprising / unresolved:
    validations:
      required: true

  - type: textarea
    id: one_sentence
    attributes:
      label: One-sentence research question
      description: State the scientific or engineering question, not merely the method.
      placeholder: Can / how / why ...?
    validations:
      required: true

  - type: dropdown
    id: project_type
    attributes:
      label: Project type
      multiple: true
      options:
        - Basic science
        - Technology development
        - Perturbation
        - Measurement
        - Theory / computation
        - Platform / infrastructure
    validations:
      required: true

  - type: textarea
    id: importance
    attributes:
      label: Problem and importance
      description: Who cares, what is blocked today, what would change if solved, and why now?
      placeholder: |
        Current bottleneck:
        Who is affected:
        What changes if solved:
        Why now:
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Best-case impact
      description: Describe the strongest credible outcome if the project succeeds.
      placeholder: |
        If successful, we would learn / enable...

        Basic science: How much would we learn? How general is the object of study?
        Technology: How widely could it be used? How critical would it be?
    validations:
      required: true

  - type: textarea
    id: weak_success
    attributes:
      label: Could it succeed and still not matter?
      description: Describe the technically successful but scientifically or practically unimportant outcome.
      placeholder: A weak-success outcome would be...

  - type: textarea
    id: hypothesis
    attributes:
      label: Key insight / hypothesis
      description: What is the non-obvious explanation, mechanism, or possibility that makes this direction interesting?
      placeholder: The central hypothesis is...
    validations:
      required: true

  - type: textarea
    id: predictions
    attributes:
      label: Discriminating predictions
      description: State observations that distinguish the hypothesis from plausible alternatives. Avoid predictions that would be compatible with almost any outcome.
      placeholder: |
        If the hypothesis is correct, we should observe:
        1. ...
        2. ...

        If the strongest alternative is correct, we should instead observe:
        1. ...
        2. ...

        Result that would make me change my mind:
    validations:
      required: true

  - type: textarea
    id: why_unsolved
    attributes:
      label: Why is this still unsolved?
      description: Explain the barrier. Consider missing data, measurement limits, computational constraints, incentives, poor framing, lack of cross-field connection, or the possibility that the problem is already largely solved.
      placeholder: |
        Main barrier:
        What changed recently that may remove it:
        Evidence that this is genuinely unresolved:
    validations:
      required: true

  - type: textarea
    id: edge
    attributes:
      label: Competitive advantage
      description: Why are you or your collaborators unusually well positioned to solve this?
      placeholder: |
        Expertise:
        Data:
        Technology:
        Collaborators / access:
        Unique combination:

  - type: textarea
    id: competition
    attributes:
      label: Competitive landscape
      description: Who else is working on this? Is the field early or crowded? What remains differentiated?
      placeholder: |
        Relevant groups / papers:
        Degree of competition (1–5):
        What is already solved:
        What remains unresolved:
        Why we could win:
        If scooped, Plan B:
        Should we go directly to Plan B?

  - type: markdown
    attributes:
      value: |
        ## Assumption analysis
        List the assumptions that must hold from the beginning of the project through the claimed conclusion. Distinguish assumptions about **underlying reality** from assumptions about **technical capability**.

  - type: textarea
    id: assumptions
    attributes:
      label: Critical assumptions
      description: Include risk and time-to-learn for each important assumption.
      placeholder: |
        | # | Assumption | Type (Reality / Technology) | Risk (1–5) | Time to learn | How to test |
        |---|---|---|---:|---|---|
        | 1 | | | | | |
        | 2 | | | | | |
        | 3 | | | | | |
    validations:
      required: true

  - type: textarea
    id: highest_risk
    attributes:
      label: Highest-risk assumption
      description: Which single assumption most threatens the project, and why?
      placeholder: The project most strongly depends on...
    validations:
      required: true

  - type: textarea
    id: first_test
    attributes:
      label: Earliest go / no-go test
      description: What is the earliest feasible experiment, analysis, prototype, or data check that could invalidate the direction or distinguish the main hypothesis from its strongest alternative?
      placeholder: |
        Minimal test:
        Competing explanations tested:
        GO if:
        CONDITIONAL GO if:
        NO-GO if:
        Estimated time / cost to learn:
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Fixed vs. floating parameters
        Avoid accidentally fixing the question, system, method, model, dataset, and endpoint all at once.

  - type: textarea
    id: parameters
    attributes:
      label: Fixed and floating parameters
      description: What must remain fixed, and what could change if a better route appears?
      placeholder: |
        | Component | Current choice | Fixed or floating? | Alternatives |
        |---|---|---|---|
        | Scientific question | | | |
        | Biological system | | | |
        | Dataset | | | |
        | Experimental method | | | |
        | Computational method / model | | | |
        | Endpoint | | | |

        Most important fixed parameter:
        Parameters that may be unnecessarily fixed:

  - type: textarea
    id: decision_tree
    attributes:
      label: Decision tree
      description: For the first major experiments or analyses, write the likely result branches and what you would do next.
      placeholder: |
        Test 1:
          Result A →
          Result B →
          Ambiguous → validation →

        Test 2:
          Result A →
          Result B →

  - type: textarea
    id: pivot
    attributes:
      label: Pivot triggers and Plan B
      description: What observations, competitive events, or technical changes would make you change direction?
      placeholder: |
        Pivot if:
        - ...

        Best alternative path:

  - type: textarea
    id: inversion
    attributes:
      label: Turn the problem on its head
      description: If the original formulation fails, can you invert or generalize the question?
      placeholder: |
        Original question:
        Inverted question:
        More general question:

  - type: textarea
    id: opportunity_cost
    attributes:
      label: Opportunity cost
      description: What other research question would receive this time if you do not pursue this one? Why is this idea currently better or worse?
      placeholder: |
        Best competing use of the same time:
        Why this idea deserves priority now:
        Reason to choose the alternative instead:

  - type: textarea
    id: future
    attributes:
      label: If this works, what comes next?
      description: What larger problem, platform, dataset, experiment, or research program would this unlock?
      placeholder: This would open the door to...

  - type: dropdown
    id: decision
    attributes:
      label: Current decision
      options:
        - Keep exploring
        - Run the first test
        - High-priority candidate
        - Park for later
        - Reject / stop
    validations:
      required: true

  - type: textarea
    id: decision_note
    attributes:
      label: Decision note
      description: In a few sentences, record why this idea should or should not receive more time now.
      placeholder: The current decision is ... because ...
